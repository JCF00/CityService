<!doctype html>
<html lang="pt-BR">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../js/theme.js"></script>
    <title>CityService - Notícias em Destaque</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen bg-[#f5f7fa] text-[#263746]">
    <div class="min-h-screen flex">
      <div id="sidebar"></div>
      <div class="w-full lg:ml-[250px] min-h-screen">
        <div id="header"></div>

        <main class="p-5 sm:p-6 lg:p-[35px]">
          <div class="flex flex-wrap items-start justify-between gap-4 mb-8">
            <div>
              <p class="text-[10px] tracking-[2.5px] uppercase font-bold text-[#20a883]">
                Praia Grande - SP
              </p>
              <h1 class="text-[30px] sm:text-[36px] font-bold mt-2">Notícias em Destaque</h1>
              <p class="text-sm text-[#667783] mt-2 max-w-[680px]">
                As matérias mais relevantes selecionadas pela Prefeitura. No máximo 3 notícias
                ficam em destaque ao mesmo tempo — as demais continuam disponíveis na página de notícias.
              </p>
            </div>

            <div class="flex items-center gap-3">
              <a
                href="news.html"
                class="inline-flex items-center gap-2 h-[46px] px-5 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] text-sm font-bold hover:bg-[#f5f7f9] transition whitespace-nowrap"
              >
                Ver todas as notícias
              </a>

              <button
                type="button"
                data-modal-trigger="newsFormModal" data-access-permission="gerenciar_noticias"
                class="inline-flex items-center gap-2 h-[46px] px-5 rounded-xl bg-gradient-to-r from-[#087dbb] to-[#20a883] text-white text-sm font-bold shadow-[0_8px_20px_rgba(8,125,187,0.2)] hover:brightness-105 active:scale-[0.98] transition whitespace-nowrap"
              >
                <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                Adicionar notícia
              </button>
            </div>
          </div>

          
          <section>
            <div id="lista-destaques" class="grid grid-cols-1 md:grid-cols-3 gap-5">
              
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="modal-container"></div>
    <script src="../js/translate.js"></script>
<script src="../js/permissoes.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/noticias.js"></script>
  </body>
</html>
