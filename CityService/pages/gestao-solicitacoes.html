<!doctype html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/theme.js"></script><title>CityService - Gestão de solicitações</title><link rel="stylesheet" href="../css/tailwind.css"><link rel="stylesheet" href="../css/style.css"></head>
<body class="min-h-screen bg-[#f5f7fa] text-[#263746]"><div class="min-h-screen flex"><div id="sidebar"></div><div class="w-full lg:ml-[250px] min-h-screen"><div id="header"></div><main class="p-5 sm:p-6 lg:p-[35px]"><div class="mb-8"><p class="text-[10px] tracking-[2px] uppercase font-bold text-[#20a883]">Atendimento</p><h1 class="text-[30px] sm:text-[36px] font-bold mt-2">Gestão de solicitações</h1><p class="text-sm text-[#667783] mt-2 max-w-[760px]">Consulte solicitações registradas e atualize o andamento do atendimento.</p></div>
<div class="grid sm:grid-cols-3 gap-4 mb-6">
<div class="bg-white border border-[#dfe4e8] rounded-2xl p-5"><p class="text-sm text-[#667783]">Total de solicitações locais</p><p id="totalRegistros" class="text-3xl font-bold mt-2">0</p></div>
<div class="bg-white border border-[#dfe4e8] rounded-2xl p-5"><p class="text-sm text-[#667783]">Em análise</p><p id="totalAnalise" class="text-3xl font-bold mt-2">0</p></div>
<div class="bg-white border border-[#dfe4e8] rounded-2xl p-5"><p class="text-sm text-[#667783]">Concluídas</p><p id="totalConcluidas" class="text-3xl font-bold mt-2">0</p></div>
</div>
<div class="bg-white border border-[#dfe4e8] rounded-2xl p-5"><div class="flex flex-wrap gap-3 mb-4"><input id="buscaSolicitacao" placeholder="Buscar por título" class="flex-1 min-w-[200px] border border-[#dfe4e8] rounded-xl px-4 py-3 text-sm"><select id="filtroStatus" class="border border-[#dfe4e8] rounded-xl px-3 py-3 text-sm"><option value="">Todos os status</option><option>Em análise</option><option>Em andamento</option><option>Concluída</option></select></div><div id="listaGestao" class="space-y-3"></div></div>
</main></div></div><div id="modal-container"></div>
<script src="../js/translate.js"></script>
<script src="../js/permissoes.js"></script><script src="../js/components.js"></script>
<script>
const esc = value => String(value || "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
function registrarAcao(acao){const chave="cityservice_auditoria_demo";const dados=JSON.parse(localStorage.getItem(chave)||"[]");dados.unshift({acao,data:new Date().toLocaleString("pt-BR"),perfil:CityServiceAccess.roles[CityServiceAccess.getRole()].label});localStorage.setItem(chave,JSON.stringify(dados.slice(0,100)));}

const getRequests=()=>JSON.parse(localStorage.getItem("cityservice_solicitacoes")||"[]");
function renderRequests(){const all=getRequests();document.getElementById("totalRegistros").textContent=all.length;document.getElementById("totalAnalise").textContent=all.filter(x=>x.status==="Em análise").length;document.getElementById("totalConcluidas").textContent=all.filter(x=>x.status==="Concluída").length;const q=document.getElementById("buscaSolicitacao").value.toLowerCase();const st=document.getElementById("filtroStatus").value;const list=all.filter(x=>(x.titulo||"").toLowerCase().includes(q)&&(!st||x.status===st));document.getElementById("listaGestao").innerHTML=list.length?list.map((x,i)=>`<article class="border border-[#e5eaee] rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h3 class="font-bold">${esc(x.titulo)}</h3><p class="text-sm text-[#667783] mt-1">${esc(x.categoria)} · ${esc(x.data)}</p><p class="text-sm mt-2">${esc(x.descricao)}</p></div><div class="flex items-center gap-2"><select data-status="${i}" class="border border-[#dfe4e8] rounded-lg px-2 py-2 text-sm">${["Em análise","Em andamento","Concluída"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select><button data-save="${i}" class="bg-[#0879b8] text-white rounded-lg px-3 py-2 text-sm font-bold">Salvar</button></div></article>`).join(""):'<p class="text-sm text-[#667783] py-8 text-center">Nenhuma solicitação local encontrada. Registros enviados na página de solicitações aparecerão aqui.</p>';document.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const index=Number(b.dataset.save);const visible=list[index];const original=all.findIndex(x=>x===visible);if(original<0)return;const statusAnterior=all[original].status;all[original].status=b.parentElement.querySelector("select").value;localStorage.setItem("cityservice_solicitacoes",JSON.stringify(all));if(all[original].usuarioEmail&&statusAnterior!==all[original].status){const chave="cityservice_notificacoes";let avisos=[];try{avisos=JSON.parse(localStorage.getItem(chave)||"[]");}catch(e){avisos=[];}avisos.unshift({id:Date.now()+Math.random(),email:all[original].usuarioEmail,title:"Solicitação atualizada",message:`A solicitação "${all[original].titulo}" agora está: ${all[original].status}.`,date:new Date().toISOString(),read:false});localStorage.setItem(chave,JSON.stringify(avisos.slice(0,150)));}registrarAcao("Atualizou status da solicitação: "+all[original].titulo);renderRequests();});}
document.getElementById("buscaSolicitacao").addEventListener("input",renderRequests);document.getElementById("filtroStatus").addEventListener("change",renderRequests);renderRequests();
</script></body></html>
