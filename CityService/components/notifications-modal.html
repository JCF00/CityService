<div
  id="notificationsModal"
  data-modal
  class="fixed inset-0 z-[999] hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4"
>
  <div
    class="w-full max-w-[520px] bg-white rounded-2xl shadow-[0_25px_70px_rgba(0,0,0,0.15)] px-6 py-6 sm:px-10 sm:py-8"
  >
    
    <div class="flex items-center justify-between">
      <h2 class="text-xl sm:text-2xl font-bold text-[#263746]">
        Notificações
      </h2>

      <button
        type="button"
        data-modal-close="notificationsModal"
        aria-label="Fechar"
        class="w-9 h-9 flex items-center justify-center rounded-lg text-[#637382] hover:bg-[#f2f6f8] transition"
      >
        ✕
      </button>
    </div>

    
    <div id="notificationsList" class="flex flex-col gap-3 mt-6 max-h-[380px] overflow-y-auto pr-1">
      <p class="text-sm text-[#637382] text-center py-8">Você ainda não possui notificações.</p>
    </div>

    
    <div class="flex flex-col gap-3 sm:gap-4 mt-6">
      <button
        type="button"
        data-modal-close="notificationsModal"
        class="w-full h-[52px] rounded-xl border border-[#dfe4e8] bg-white text-[#637382] font-medium hover:bg-[#f5f7f9] transition"
      >
        Fechar
      </button>

      <button
        type="button"
        data-modal-confirm="notificationsModal"
        data-modal-action="markAllAsRead"
        class="w-full h-[52px] rounded-xl bg-gradient-to-r from-[#087dbb] to-[#20a883] text-white font-semibold hover:brightness-105 transition shadow-[0_8px_20px_rgba(8,125,187,0.25)]"
      >
        Marcar todas como lidas
      </button>
    </div>

  </div>
</div>
