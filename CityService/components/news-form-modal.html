<div
  id="newsFormModal"
  data-modal
  class="fixed inset-0 z-[999] hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4 overflow-y-auto"
>
  <div class="w-full max-w-[580px] max-h-[calc(100vh-2rem)] overflow-y-auto bg-white rounded-2xl shadow-[0_25px_70px_rgba(0,0,0,0.15)] px-6 py-6 sm:px-10 sm:py-8">
    <h2 id="newsFormTitle" class="text-xl sm:text-2xl font-bold text-[#263746] text-center">
      Adicionar nova notícia
    </h2>

    <form id="newsForm" class="flex flex-col gap-4 mt-6 sm:mt-8">

      
      <div>
        <label class="block text-sm font-medium text-[#263746] mb-1">
          Imagem da notícia
        </label>

        <label
          for="newsImageInput"
          class="flex items-center justify-center gap-2 w-full h-[52px] px-4 rounded-xl border-2 border-dashed border-[#cfd8dd] bg-[#f7fafb] text-[#637382] text-sm font-medium hover:bg-[#f0f5f7] hover:border-[#0879b8] transition cursor-pointer"
        >
          <svg class="w-[19px] h-[19px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4 7 9M12 4l5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          Escolher imagem do computador
        </label>

        <input
          id="newsImageInput"
          name="imagem"
          type="file"
          accept="image/jpeg,image/jpg,image/png,image/webp"
          class="hidden"
        />

        <p class="text-[11px] text-[#9aa5ad] mt-1.5">
          Formatos aceitos: JPG, PNG ou WEBP.
        </p>

        <div id="newsImagePreviewWrapper" class="hidden mt-3 rounded-xl overflow-hidden border border-[#dfe4e8]">
          <img id="newsImagePreview" src="" alt="Pré-visualização da imagem" class="w-full h-40 object-cover" />
        </div>
      </div>

      
      <div>
        <label for="newsTitle" class="block text-sm font-medium text-[#263746] mb-1">
          Título
        </label>
        <input
          id="newsTitle"
          name="titulo"
          type="text"
          required
          placeholder="Ex.: Nova unidade de saúde é inaugurada no bairro"
          class="w-full h-[48px] px-4 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] placeholder:text-[#a7b1b9] focus:outline-none focus:border-[#087dbb] transition"
        />
      </div>

      
      <div>
        <label for="newsSummary" class="block text-sm font-medium text-[#263746] mb-1">
          Subtítulo / Resumo
        </label>
        <textarea
          id="newsSummary"
          name="resumo"
          rows="2"
          required
          placeholder="Breve resumo que aparece no card e na abertura da matéria…"
          class="w-full px-4 py-3 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] placeholder:text-[#a7b1b9] focus:outline-none focus:border-[#087dbb] transition resize-none"
        ></textarea>
      </div>

      
      <div>
        <label for="newsContent" class="block text-sm font-medium text-[#263746] mb-1">
          Conteúdo completo
        </label>
        <textarea
          id="newsContent"
          name="conteudo"
          rows="6"
          required
          placeholder="Texto completo da notícia…"
          class="w-full px-4 py-3 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] placeholder:text-[#a7b1b9] focus:outline-none focus:border-[#087dbb] transition resize-none"
        ></textarea>
      </div>

      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="newsCategory" class="block text-sm font-medium text-[#263746] mb-1">
            Categoria
          </label>
          <input
            id="newsCategory"
            name="categoria"
            type="text"
            required
            list="newsCategoryOptions"
            placeholder="Ex.: Saúde"
            class="w-full h-[48px] px-4 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] placeholder:text-[#a7b1b9] focus:outline-none focus:border-[#087dbb] transition"
          />
          <datalist id="newsCategoryOptions">
            <option value="Educação & Inovação"></option>
            <option value="Turismo & Infraestrutura"></option>
            <option value="Cidadania"></option>
            <option value="Saúde"></option>
            <option value="Segurança"></option>
            <option value="Meio Ambiente"></option>
            <option value="Atendimento"></option>
          </datalist>
        </div>

        <div>
          <label for="newsAuthor" class="block text-sm font-medium text-[#263746] mb-1">
            Autor / Fonte
          </label>
          <input
            id="newsAuthor"
            name="autor"
            type="text"
            placeholder="Prefeitura de Praia Grande"
            class="w-full h-[48px] px-4 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] placeholder:text-[#a7b1b9] focus:outline-none focus:border-[#087dbb] transition"
          />
        </div>
      </div>

      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="newsDate" class="block text-sm font-medium text-[#263746] mb-1">
            Data
          </label>
          <input
            id="newsDate"
            name="data"
            type="date"
            required
            class="w-full h-[48px] px-4 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] focus:outline-none focus:border-[#087dbb] transition"
          />
        </div>

        <div>
          <label for="newsTime" class="block text-sm font-medium text-[#263746] mb-1">
            Horário
          </label>
          <input
            id="newsTime"
            name="horario"
            type="time"
            class="w-full h-[48px] px-4 rounded-xl border border-[#dfe4e8] bg-white text-[#263746] focus:outline-none focus:border-[#087dbb] transition"
          />
        </div>
      </div>

      
      <div class="flex items-center gap-2.5 px-1 -mt-1">
        <input
          id="newsFeatured"
          name="destaque"
          type="checkbox"
          class="w-[18px] h-[18px] rounded border-[#cfd8dd] text-[#0879b8] focus:ring-[#0879b8] cursor-pointer"
        />
        <label for="newsFeatured" class="text-sm font-medium text-[#263746] cursor-pointer select-none">
          Colocar como notícia em destaque
        </label>
      </div>
      <p class="text-[11px] text-[#9aa5ad] -mt-3 px-1">
        No máximo 3 notícias ficam em destaque ao mesmo tempo. Ao ultrapassar o limite, a mais antiga sai automaticamente do destaque (sem ser excluída).
      </p>

      
      <div class="flex flex-col gap-3 sm:gap-4 mt-2">
        <button
          type="button"
          data-modal-close="newsFormModal"
          class="w-full h-[52px] rounded-xl border border-[#dfe4e8] bg-white text-[#637382] font-medium hover:bg-[#f5f7f9] transition"
        >
          Cancelar
        </button>

        <button
          id="newsSubmitBtn"
          type="submit"
          class="w-full h-[52px] rounded-xl bg-gradient-to-r from-[#087dbb] to-[#20a883] text-white font-semibold hover:brightness-105 transition shadow-[0_8px_20px_rgba(8,125,187,0.25)]"
        >
          Salvar notícia
        </button>
      </div>

    </form>
  </div>
</div>
