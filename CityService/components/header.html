<header class="h-[78px] bg-white/95 backdrop-blur-xl border-b border-[#dfe7eb] flex items-center justify-between px-5 sm:px-7 lg:px-[35px] sticky top-0 z-30">
  <div class="flex items-center gap-3 min-w-0">
    <div class="hidden sm:flex w-9 h-9 rounded-xl bg-gradient-to-br from-[#e9f7f3] to-[#e9f4fa] items-center justify-center text-[#0879b8]">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/>
      </svg>
    </div>
    <div class="min-w-0">
      <p class="text-[10px] uppercase tracking-[2px] font-bold text-[#20a883] hidden sm:block">CityService</p>
      <p class="text-sm font-semibold text-[#263746] truncate">Portal do cidadão</p>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-4">
    <button type="button" data-modal-trigger="notificationsModal"
      class="group relative w-10 h-10 rounded-xl flex items-center justify-center text-[#596b79] hover:text-[#0879b8] hover:bg-[#f0f7fb] transition"
      aria-label="Abrir notificações">
      <svg class="w-[21px] h-[21px] group-hover:rotate-[7deg] transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>
      </svg>
      <span data-notification-count class="hidden absolute -top-0.5 -right-0.5 min-w-5 h-5 px-1 rounded-full bg-[#20a883] ring-2 ring-white text-white text-[10px] font-bold flex items-center justify-center">0</span>
    </button>

    <div class="hidden sm:block w-px h-7 bg-[#e4e9ed]"></div>

    <button id="profileBtn" type="button" data-modal-trigger="profileModal"
      class="group flex items-center gap-2.5 rounded-2xl pl-1.5 pr-2.5 py-1.5 border border-transparent hover:border-[#d6ece5] hover:bg-[#f6fbfa] transition text-left"
      aria-label="Abrir perfil">
      <span class="relative">
        <span data-user-initials class="w-9 h-9 rounded-full bg-gradient-to-br from-[#e5f2f8] to-[#def2eb] flex items-center justify-center text-[#0879b8] font-bold text-[11px] ring-2 ring-white shadow-sm">US</span>
        <span class="absolute -right-0.5 -bottom-0.5 w-3 h-3 rounded-full bg-[#20a883] ring-2 ring-white"></span>
      </span>
      <span class="hidden sm:block leading-tight">
        <span data-user-name class="block text-[13px] font-bold text-[#263746]">Usuário</span>
        <span data-role-name class="block text-[10px] text-[#7a8790] mt-0.5">Cidadão</span>
      </span>
      <svg class="hidden sm:block w-4 h-4 text-[#9aa6ad] group-hover:text-[#0879b8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
</header>
